[package]
name = "fika-station"
description = "fika station runtime: audio, rig control, streaming receiver, transmit queue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["pipewire"]
# Native PipeWire backend: address nodes by name, needed for `[live]`.
# Build with --no-default-features for ALSA-only (e.g. cross builds).
pipewire = ["dep:pipewire"]

[dependencies]
pipewire = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
cpal.workspace = true
ringbuf.workspace = true
rand.workspace = true
fika-modem.workspace = true
fika-proto.workspace = true
fika-channel.workspace = true
rand_distr.workspace = true

[dev-dependencies]
toml.workspace = true
